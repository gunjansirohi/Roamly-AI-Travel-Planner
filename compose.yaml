services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGINS: http://localhost:8080
      TRUST_PROXY: "true"
      MONGODB_URI: mongodb://mongo:27017/roamly
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      CLIENT_URL: http://localhost:8080
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
